{% extends "base.html" %}

{% block title %}Check Your Email{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col md:flex-row">
    
    <div class="flex-grow flex items-center justify-center p-6 md:p-12 bg-surface">
        <div class="w-full max-w-md space-y-8 text-center">
            
            <div class="w-20 h-20 mx-auto flex items-center justify-center rounded-full bg-primary/10 text-primary">
                <i data-lucide="mail-check" class="w-10 h-10"></i>
            </div>

            <div>
                <h1 class="font-serif text-4xl text-text mb-4">Check Your Email</h1>
                <p class="text-muted leading-relaxed">
                    If an account exists for the email you entered, we have sent a password reset link. Please check your inbox and spam folder.
                </p>
            </div>

            <div class="pt-8">
                <a href="{% url 'accounts:login' %}" class="inline-block w-full py-4 bg-primary text-surface font-bold uppercase tracking-widest rounded hover:bg-muted transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
